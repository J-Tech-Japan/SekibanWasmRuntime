name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sekiban_mv_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sekiban_mv_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - name: Restore
        run: dotnet restore src/SekibanWasmRuntime.ci.slnx
      - name: Build
        run: dotnet build src/SekibanWasmRuntime.ci.slnx -c Release --no-restore

      - name: Install WASI SDK
        run: |
          WASI_SDK_VERSION=29
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | sudo tar xz -C /opt
          sudo ln -sf /opt/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux /opt/wasi-sdk

      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Build C# WASM module
        run: ./build/scripts/build-csharp-wasm.sh
      - name: Build Rust WASM module
        run: ./build/scripts/build-rust-wasm.sh
      - name: Build primary sample WASM modules
        run: ./scripts/build-samples-wasm.sh --primary
      - name: Verify serialized DCB V1 suite isolation
        run: bash scripts/contract/check-serialized-dcb-v1-isolation.sh
      - name: Serialized DCB V1 header option killing test
        run: python3 scripts/contract/test-serialized-dcb-v1-headers.py
      - name: Serialized DCB V1 external black-box conformance
        run: bash scripts/contract/run-serialized-dcb-v1-ci.sh

      - name: Test (excluding private-upstream component tests)
        env:
          SEKIBAN_MV_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=sekiban_mv_tests;Username=postgres;Password=postgres;Pooling=false
        # TypeScriptComponentGuestTests remain an explicit manual path until
        # the upstream npm package is public and available to clean CI.
        run: dotnet test src/SekibanWasmRuntime.ci.slnx -c Release --no-build --filter 'Category!=PrivateUpstreamComponent'

      - name: E2E (Aspire + Playwright, CS)
        env:
          E2E_SAMPLE: cs
        run: ./scripts/e2e-aspire-playwright.sh

      - name: Pack
        run: dotnet pack src/SekibanWasmRuntime.ci.slnx -c Release -o artifacts/nuget --no-build --no-restore
