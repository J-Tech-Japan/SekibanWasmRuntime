name: release-templates-preview

# Release lane for the Sekiban.Dcb.WasmRuntime.Templates package.
#
# A published GitHub Release with a `templates-v*` tag defines the release
# moment and the package version (the `templates-v` prefix is stripped).
# Releases with other tags are skipped so this lane never fires for the
# runtime/SDK lanes. The actual NuGet publish is gated behind the protected
# `templates-release` environment and is not exercised until the human-gated
# first-publish prerequisites are met.

on:
  pull_request:
    paths:
      - '.github/workflows/release-templates-preview.yml'
      - 'templates/**'
      - 'scripts/templates/**'
      - 'scripts/release/**'
      - 'docs/nuget/templates-package-readme.md'
      - 'docs/templates/**'
      - 'docs/release/**'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Templates package version to validate (and publish when publish=true)'
        required: true
        default: '1.0.0-preview.1'
      runtime_package_version:
        description: 'Runtime package version asserted by the Templates README'
        required: true
        default: '1.0.0-preview.7'
      dcb_version:
        description: 'Sekiban.Dcb baseline asserted by the Templates README'
        required: true
        default: '10.22.0'
      publish:
        description: 'Emergency manual publish to NuGet after checks (normally publish via a templates-v* GitHub Release)'
        type: boolean
        required: true
        default: false
  release:
    types: [published]

permissions:
  contents: read

env:
  # templates-v* release tag wins; workflow_dispatch input is the fallback.
  RAW_PACKAGE_VERSION: ${{ github.event.release.tag_name || inputs.package_version || '1.0.0-preview.1' }}
  RUNTIME_PACKAGE_VERSION: ${{ inputs.runtime_package_version || '1.0.0-preview.7' }}
  SEKIBAN_DCB_VERSION: ${{ inputs.dcb_version || '10.22.0' }}

jobs:
  validate:
    name: template pack / generate / build checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip releases from other lanes (nuget v*, rust-v*, ts-v*, ...) early.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'templates-v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: docker/setup-buildx-action@v3

      - name: Resolve package version
        run: |
          set -euo pipefail
          version="${RAW_PACKAGE_VERSION#templates-v}"
          echo "TEMPLATE_PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Using TEMPLATE_PACKAGE_VERSION=${version}"

      - name: Pack templates package
        run: |
          set -euo pipefail
          dotnet pack templates/Sekiban.Dcb.WasmRuntime.Templates/Sekiban.Dcb.WasmRuntime.Templates.csproj \
            -c Release -o artifacts/packages "-p:Version=${TEMPLATE_PACKAGE_VERSION}"

      - name: Template dependency/version drift
        run: bash scripts/templates/test-template-version-drift.sh

      - name: Resolve runtime-host image version for consumer docs
        id: runtime-image
        run: |
          set -euo pipefail
          echo "RUNTIME_IMAGE_VERSION=${RUNTIME_PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "version=${RUNTIME_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Consumer docs target runtime image ${RUNTIME_PACKAGE_VERSION}"

      - name: Consumer README accuracy (produced Templates nupkg)
        env:
          RUNTIME_IMAGE_VERSION: ${{ steps.runtime-image.outputs.version }}
        run: scripts/release/check-template-package-readme.sh

      - name: Generation test (pack, install, generate, build, residue check)
        env:
          TEMPLATE_TEST_PACKAGE_VERSION: ${{ env.TEMPLATE_PACKAGE_VERSION }}
          TEMPLATE_TEST_ASPIRE_PACKAGE_VERSION: ${{ env.RUNTIME_PACKAGE_VERSION }}
        run: bash scripts/templates/test-sekiban-wasm-decider.sh

      - name: Prepare validation runtime image for generated smokes
        env:
          RUNTIME_IMAGE_TAG: ${{ env.RUNTIME_PACKAGE_VERSION }}
        run: bash scripts/release/prepare-validation-runtime-image.sh

      - name: Generated weather runtime smoke
        id: generated-weather-smoke
        shell: bash
        run: |
          set -uo pipefail
          smoke_script=artifacts/template-test/work/AcmeWeather-tests-true/AcmeWeather/scripts/smoke.sh
          smoke_report=artifacts/template-test/work/AcmeWeather-tests-true/AcmeWeather/reports/smoke/AcmeWeather-smoke.md
          smoke_exit=0
          bash "$smoke_script" || smoke_exit=$?

          if [[ ! -s "$smoke_report" ]]; then
            echo "Generated weather runtime smoke did not produce its report: $smoke_report"
            exit 1
          fi

          echo '--- generated weather runtime smoke report ---'
          cat "$smoke_report"
          echo '--- end generated weather runtime smoke report ---'

          result="$(sed -n 's/^- Result: \*\*\([^*]*\)\*\*$/\1/p' "$smoke_report" | head -n 1)"
          detail="$(sed -n 's/^- Detail: //p' "$smoke_report" | head -n 1)"
          case "$result" in
            PASS)
              if [[ "$smoke_exit" -ne 0 ]]; then
                echo "Smoke report says PASS but smoke exited with $smoke_exit"
                exit 1
              fi
              ;;
            SKIP)
              if [[ "$smoke_exit" -ne 0 ]]; then
                echo "Smoke report says SKIP but smoke exited with $smoke_exit"
                exit 1
              fi
              docker_unavailable=false
              if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
                docker_unavailable=true
              fi
              if [[ "$detail" == "Docker is not available (the runtime container needs it)." && "$docker_unavailable" == true ]]; then
                echo 'Accepted smoke SKIP: Docker is unavailable on this runner.'
              else
                echo "Generated weather runtime smoke SKIP is not permitted: $detail"
                exit 1
              fi
              ;;
            FAIL)
              echo "Generated weather runtime smoke failed: $detail"
              exit 1
              ;;
            *)
              echo "Generated weather runtime smoke report has an unknown result: $result"
              exit 1
              ;;
          esac

      - name: Upload generated weather runtime smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: templates-preview-${{ env.TEMPLATE_PACKAGE_VERSION }}-smoke
          path: artifacts/template-test/work/AcmeWeather-tests-true/AcmeWeather/reports/smoke/AcmeWeather-smoke.md
          if-no-files-found: error

      - name: Consumer version assertion regression
        env:
          RUNTIME_IMAGE_VERSION: ${{ steps.runtime-image.outputs.version }}
        run: scripts/release/test-consumer-version-accuracy.sh

      - name: Whitespace check
        run: git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: templates-preview-${{ env.TEMPLATE_PACKAGE_VERSION }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: publish templates package to NuGet
    runs-on: ubuntu-latest
    needs: validate
    # Publish on a published templates-v* GitHub Release, or on an explicit
    # emergency manual dispatch. The protected `templates-release` environment
    # still gates this job; it stays un-exercised until the human-gated
    # first-publish prerequisites are met.
    if: >-
      github.repository == 'J-Tech-Japan/SekibanWasmRuntime' &&
      ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'templates-v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: templates-release
    steps:
      # Self-contained on a clean runner: checkout and re-pack rather than
      # trusting artifacts from another job.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: docker/setup-buildx-action@v3

      - name: Resolve package version
        run: |
          set -euo pipefail
          version="${RAW_PACKAGE_VERSION#templates-v}"
          echo "TEMPLATE_PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Using TEMPLATE_PACKAGE_VERSION=${version}"

      - name: Pack templates package
        run: |
          set -euo pipefail
          dotnet pack templates/Sekiban.Dcb.WasmRuntime.Templates/Sekiban.Dcb.WasmRuntime.Templates.csproj \
            -c Release -o artifacts/publish "-p:Version=${TEMPLATE_PACKAGE_VERSION}"

      - name: Resolve runtime-host image version for consumer docs
        id: runtime-image
        run: |
          set -euo pipefail
          echo "RUNTIME_IMAGE_VERSION=${RUNTIME_PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "version=${RUNTIME_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Consumer docs target runtime image ${RUNTIME_PACKAGE_VERSION}"

      - name: Consumer README accuracy (produced Templates nupkg)
        env:
          TEMPLATE_PACKAGE_DIR: artifacts/publish
          RUNTIME_IMAGE_VERSION: ${{ steps.runtime-image.outputs.version }}
        run: scripts/release/check-template-package-readme.sh

      - name: NuGet login via Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: tomohisa_takaoka

      - name: Publish package
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/publish/Sekiban.Dcb.WasmRuntime.Templates.${TEMPLATE_PACKAGE_VERSION}.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
