[package]
name = "cargo-sekiban"
version = "0.1.0"
edition = "2021"
description = "Cargo subcommand for scaffolding standalone Sekiban Rust WASM Decider projects."
license = "Elastic-2.0"
homepage = "https://github.com/J-Tech-Japan/SekibanWasmRuntime"
repository = "https://github.com/J-Tech-Japan/SekibanWasmRuntime"
readme = "README.md"
keywords = ["sekiban", "wasm", "wasi", "scaffolding", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "build.rs",
    "src/**",
]

[[bin]]
name = "cargo-sekiban"
path = "src/main.rs"
